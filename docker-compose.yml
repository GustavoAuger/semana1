version: "3.9"
services:
  db:
    image: mysql:8.0
    container_name: eureka_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: eureka
      MYSQL_USER: eureka
      MYSQL_PASSWORD: secret
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: eureka_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: eureka
      MYSQL_USER: eureka
      MYSQL_PASSWORD: secret
    ports:
      - "8080:8080"

volumes:
  db_data:
